server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 32M;

    # Compress text responses (HTML is always included by default).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Symfony front controller. Only index.php is allowed to be executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        internal;
    }

    # Return 404 for any other .php file so they can't be executed directly.
    location ~ \.php$ {
        return 404;
    }

    # Long-cache AssetMapper fingerprinted assets.
    location ~* "^/assets/.*\.[0-9a-f]{8,}\.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$" {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Internal cover-cache delivery. CoverController does the authorization and
    # cache resolution, then hands the finished file off with an X-Accel-Redirect
    # to this location so nginx — not a PHP-FPM worker — streams the bytes. Not
    # reachable directly from the outside (`internal`).
    location /_covers/ {
        internal;
        alias /var/www/html/book-covers/;
        access_log off;
        # Cache-Control comes from CoverController and passes through untouched.
        # nginx generates the ETag here (upstream ETags are dropped across an
        # X-Accel-Redirect); CoverController reproduces the same "<mtime>-<size>"
        # value so revalidations 304 in PHP without re-entering this location.
        etag on;
    }

    error_log /var/log/nginx/spinescout_error.log;
    access_log /var/log/nginx/spinescout_access.log;
}
