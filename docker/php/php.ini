; Spine Scout PHP runtime tuning. The dev override layer mounts a separate
; ini fragment to relax these for development.

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data
; Preloads the compiled prod container (config/preload.php is a no-op when the
; prod cache hasn't been built). Preloaded classes are permanent and are NOT
; revalidated by opcache.validate_timestamps, so the dev ini overlay disables
; this again — otherwise a dev container would serve the baked prod classes and
; ignore edits to src/.
opcache.preload = /var/www/html/config/preload.php

realpath_cache_size = 4096K
realpath_cache_ttl = 600
