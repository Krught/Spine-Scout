; Dev-only PHP overrides. Mounted on top of zz-spinescout.ini by compose.override.yaml.

opcache.validate_timestamps = 1
; Disable the prod-container preload. Preloaded classes are immune to timestamp
; revalidation, so leaving it on would pin the image's baked prod classes and
; make edits under src/ invisible in dev.
opcache.preload =
opcache.revalidate_freq = 0
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
